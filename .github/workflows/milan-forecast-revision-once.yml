name: One-shot Milan forecast revision probe

on:
  push:
    paths:
      - '.github/workflows/milan-forecast-revision-once.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact archived forecast runs and station observations
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import io
          import json
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          OUT = pathlib.Path('research/data')
          OUT.mkdir(parents=True, exist_ok=True)
          TZ = ZoneInfo('Europe/Rome')
          STATIONS = {
              'LIMC': {'lat': 45.61667, 'lon': 8.73333, 'label': 'Malpensa resolver'},
              'LIML': {'lat': 45.43333, 'lon': 9.28333, 'label': 'Linate comparator'},
          }
          CASES = {
              'milan_june25': {
                  'target_date': '2026-06-25',
                  'runs': [
                      '2026-06-23T18:00',
                      '2026-06-24T00:00',
                      '2026-06-24T06:00',
                      '2026-06-24T12:00',
                      '2026-06-24T18:00',
                      '2026-06-25T00:00',
                  ],
                  'wallet_actions': [
                      {'ts':'2026-06-24T01:58:13Z','action':'BUY','bucket_c':34,'price':0.489999998,'size':61.224488},
                      {'ts':'2026-06-24T02:28:49Z','action':'BUY','bucket_c':33,'price':0.1548114449,'size':193.784116},
                      {'ts':'2026-06-25T01:11:47Z','action':'SELL','bucket_c':33,'price':0.114191351,'size':193.78},
                      {'ts':'2026-06-25T01:12:02Z','action':'BUY','bucket_c':34,'price':0.4599999939,'size':65.21739},
                  ],
              },
              'milan_june30': {
                  'target_date': '2026-06-30',
                  'runs': [
                      '2026-06-28T00:00',
                      '2026-06-28T06:00',
                      '2026-06-28T12:00',
                      '2026-06-28T18:00',
                      '2026-06-29T00:00',
                      '2026-06-29T06:00',
                  ],
                  'wallet_actions': [
                      {'ts':'2026-06-29T01:55:11Z','action':'BUY','bucket_c':35,'price':0.2937835403,'size':102.116},
                  ],
              },
          }

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'polymarket-weather-research/1.0'})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read()

          def forecast(station, run, target_date):
              s = STATIONS[station]
              params = {
                  'latitude': s['lat'],
                  'longitude': s['lon'],
                  'hourly': 'temperature_2m',
                  'models': 'ecmwf_ifs',
                  'run': run,
                  'forecast_days': 4,
                  'timezone': 'Europe/Rome',
              }
              url = 'https://single-runs-api.open-meteo.com/v1/forecast?' + urllib.parse.urlencode(params)
              payload = json.loads(get(url))
              times = payload['hourly']['time']
              vals = payload['hourly']['temperature_2m']
              pairs = [(t, v) for t, v in zip(times, vals) if t[:10] == target_date and v is not None]
              if not pairs:
                  raise RuntimeError(f'No target-date values for {station} {run} {target_date}: {url}')
              max_t, max_v = max(pairs, key=lambda x: x[1])
              return {
                  'station': station,
                  'run': run,
                  'target_date': target_date,
                  'max_c': max_v,
                  'max_local_time': max_t,
                  'target_hours': len(pairs),
                  'url': url,
              }

          result = {'generated_at': dt.datetime.now(dt.timezone.utc).isoformat(), 'model':'ecmwf_ifs', 'cases':{}}
          for case_name, case in CASES.items():
              target_date = case['target_date']
              rows = []
              for run in case['runs']:
                  for station in STATIONS:
                      try:
                          rows.append(forecast(station, run, target_date))
                      except Exception as e:
                          rows.append({'station':station,'run':run,'target_date':target_date,'error':repr(e)})
              result['cases'][case_name] = {
                  'target_date': target_date,
                  'wallet_actions': case['wallet_actions'],
                  'forecasts': rows,
              }

          # IEM computed daily summaries: research proxy for paired realized station maxima.
          params = [
              ('sts','2026-06-23'),('ets','2026-06-30'),('network','IT__ASOS'),
              ('stations','LIMC,LIML'),('var','max_temp_f'),('format','csv'),('na','blank'),
          ]
          iem_url = 'https://mesonet.agron.iastate.edu/cgi-bin/request/daily.py?' + urllib.parse.urlencode(params)
          text = get(iem_url).decode('utf-8')
          obs = []
          for row in csv.DictReader(io.StringIO(text)):
              f = row.get('max_temp_f')
              if not f:
                  continue
              fv = float(f)
              obs.append({
                  'station': row['station'],
                  'date': row['day'][:10],
                  'max_f': fv,
                  'max_c': (fv - 32.0) * 5.0 / 9.0,
              })
          result['iem_daily_proxy'] = {'url': iem_url, 'rows': obs}

          (OUT / 'milan-forecast-revision-probe.json').write_text(json.dumps(result, indent=2), encoding='utf-8')

          lines = [
              '# Milan forecast-revision probe', '',
              f'Generated: **{result["generated_at"]}**', '',
              'Model: **ECMWF IFS via Open-Meteo Single Runs archive**.', '',
              'The run timestamp is model initialization time, not public availability time. Compare wallet trades only to runs actually disseminated before the trade.', '',
          ]
          for case_name, case in result['cases'].items():
              lines += [f'## {case_name} — target {case["target_date"]}', '', '### Wallet actions', '']
              for a in case['wallet_actions']:
                  lines.append(f'- `{a["ts"]}` — **{a["action"]} {a["bucket_c"]}°C** — {a["size"]:.6f} @ {a["price"]:.4f}')
              lines += ['', '### ECMWF deterministic daily maxima', '', '| Run | LIMC resolver max | LIML comparator max | LIMC-LIML |', '|---|---:|---:|---:|']
              byrun = {}
              for row in case['forecasts']:
                  byrun.setdefault(row['run'], {})[row['station']] = row
              for run in case['runs'] if 'runs' in case else sorted(byrun):
                  a = byrun.get(run, {}).get('LIMC', {})
                  b = byrun.get(run, {}).get('LIML', {})
                  if 'max_c' in a and 'max_c' in b:
                      lines.append(f'| {run} | {a["max_c"]:.1f}°C | {b["max_c"]:.1f}°C | {a["max_c"]-b["max_c"]:+.1f}°C |')
                  else:
                      lines.append(f'| {run} | {a.get("error","NA")} | {b.get("error","NA")} | NA |')
              lines.append('')

          lines += ['## IEM daily-summary proxy', '', '| Date | LIMC | LIML | Basis |', '|---|---:|---:|---:|']
          byday = {}
          for row in obs:
              byday.setdefault(row['date'], {})[row['station']] = row['max_c']
          for day in sorted(byday):
              a = byday[day].get('LIMC'); b = byday[day].get('LIML')
              if a is not None and b is not None:
                  lines.append(f'| {day} | {a:.1f}°C | {b:.1f}°C | {a-b:+.1f}°C |')
          lines += ['', 'IEM values are a research proxy, not contractual Wunderground settlement truth.', '']
          (OUT / 'milan-forecast-revision-probe.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit probe output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/milan-forecast-revision-probe.json research/data/milan-forecast-revision-probe.md
          git diff --cached --quiet && exit 0
          git commit -m "data: capture Milan archived forecast revisions"
          git push
