name: One-shot fix NegRisk token outcome mapping

on:
  push:
    paths:
      - '.github/workflows/fix-token-outcome-mapping-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch enrichment
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p = Path('scripts/enrich_v2_wallet_orders.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('USER_AGENT = "polymarket-weather-enrich-v2-wallet-orders/1.0"\n', 'USER_AGENT = "polymarket-weather-enrich-v2-wallet-orders/1.1"\nMETADATA_SCHEMA_VERSION = 2\n')
          s = t.index('def resolve_token(token_id: str, *, timeout: float) -> dict[str, Any]:\n')
          e = t.index('\n\ndef load_cache(', s)
          replacement = base64.b64decode('').decode('utf-8')
          t = t[:s] + replacement + t[e:]
          old = '            metadata = cache.get(token_id)\n            enrichment_error = None\n'
          new = '            metadata = cache.get(token_id)\n            if metadata is not None and metadata.get("metadata_schema_version") != METADATA_SCHEMA_VERSION:\n                metadata = None\n            enrichment_error = None\n'
          if old not in t:
              raise SystemExit('cache block not found')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY
          python -m py_compile scripts/enrich_v2_wallet_orders.py
      - name: Validate London NegRisk side
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from enrich_v2_wallet_orders import resolve_token
          token = '91076181803621459956200090324917139595424901620108017335569536029558392706177'
          m = resolve_token(token, timeout=30)
          assert m['token_outcome'].lower() == 'yes', m
          assert m['yes_token_id'] == token, m
          assert m['secondary_token_id'] == token, m
          assert m['gamma_lookup_error'], m
          print('validated: secondary token is explicit Yes')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/enrich_v2_wallet_orders.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: derive token outcomes from explicit CLOB labels"
          git push
