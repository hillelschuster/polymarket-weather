name: Inspect NASA GISTEMP source

on:
  push:
    paths:
      - '.github/workflows/inspect-gistemp-source.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download NASA source
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            https://data.giss.nasa.gov/gistemp/sources_v4/gistemp4.0.tar.gz \
            -o /tmp/gistemp4.0.tar.gz
          sha256sum /tmp/gistemp4.0.tar.gz
          mkdir -p /tmp/gistemp-src
          tar -xzf /tmp/gistemp4.0.tar.gz -C /tmp/gistemp-src
      - name: Print exact inputs and run instructions
        run: |
          set -euxo pipefail
          cd /tmp/gistemp-src/gistemp4.0
          echo '--- config/sources.txt ---'
          cat config/sources.txt
          echo '--- README_steps running/results ---'
          sed -n '/## 4. INPUT DATA/,/## A. REFERENCES/p' doc/README_steps.md
      - name: Run NASA GISTEMP package
        run: |
          set -euxo pipefail
          cd /tmp/gistemp-src/gistemp4.0
          python -m pip install --disable-pip-version-check --quiet numpy scipy
          time python tool/run.py
          echo '--- result files ---'
          find tmp/result -maxdepth 2 -type f -printf '%p\n' | sort
          echo '--- current target rows ---'
          grep -R -nE '(^|[^0-9])2026([^0-9]|$)' tmp/result | tail -80 || true
          echo '--- likely global tables ---'
          for f in tmp/result/*; do
            if [ -f "$f" ]; then
              case "$f" in
                *.csv|*.txt) echo "--- $f"; tail -25 "$f" ;;
              esac
            fi
          done
