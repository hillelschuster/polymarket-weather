name: One-shot bounded Milan multi-model probe

on:
  push:
    paths:
      - '.github/workflows/milan-multimodel-fast-once.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch model runs concurrently
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures as cf
          import datetime as dt
          import json, math, pathlib, statistics
          import urllib.error, urllib.parse, urllib.request

          OUT=pathlib.Path('research/data'); OUT.mkdir(parents=True,exist_ok=True)
          END='https://single-runs-api.open-meteo.com/v1/forecast'
          LAT,LON=45.61667,8.73333
          MODELS={
            'ECMWF IFS':'ecmwf_ifs',
            'DWD ICON-EU':'dwd_icon_eu',
            'DWD ICON Global':'dwd_icon_global',
            'ARPEGE Europe':'meteofrance_arpege_europe',
            'ItaliaMeteo ICON-2I':'italia_meteo_arpae_icon_2i',
          }
          CASES={
            'milan_june25':{'run_date':'2026-06-24','target_date':'2026-06-25','trade':'2026-06-25T01:12:00Z','actions':[('SELL',33,0.114191351,193.78),('BUY',34,0.4599999939,65.21739)]},
            'milan_june30':{'run_date':'2026-06-28','target_date':'2026-06-30','trade':'2026-06-29T01:55:11Z','actions':[('BUY',35,0.2937835403,102.116)]},
          }

          def fetch(task):
            case,stage,label,model,run,target=task
            params={'latitude':LAT,'longitude':LON,'hourly':'temperature_2m','models':model,'run':run,'forecast_days':4,'timezone':'Europe/Rome'}
            url=END+'?'+urllib.parse.urlencode(params)
            row={'case':case,'stage':stage,'provider_model':label,'model_id':model,'run':run,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'polymarket-weather-research/1.0'})
              with urllib.request.urlopen(req,timeout=15) as r: p=json.loads(r.read())
              vals=[(t,v) for t,v in zip(p['hourly']['time'],p['hourly']['temperature_2m']) if t[:10]==target and v is not None]
              if not vals: raise RuntimeError('no target-date rows')
              t,v=max(vals,key=lambda x:x[1]); row.update(max_c=float(v),max_local_time=t)
            except urllib.error.HTTPError as e:
              row['error']=f'HTTP {e.code}: '+e.read().decode('utf-8',errors='replace')
            except Exception as e: row['error']=repr(e)
            return row

          tasks=[]
          for cname,c in CASES.items():
            for label,model in MODELS.items():
              for stage,hour in [('pre_12z','12:00'),('post_18z','18:00')]:
                if model=='italia_meteo_arpae_icon_2i' and stage=='post_18z': hour='12:00'
                tasks.append((cname,stage,label,model,f"{c['run_date']}T{hour}",c['target_date']))
            tasks.append((cname,'icon_eu_21z_candidate','DWD ICON-EU','dwd_icon_eu',f"{c['run_date']}T21:00",c['target_date']))

          with cf.ThreadPoolExecutor(max_workers=12) as ex: rows=list(ex.map(fetch,tasks))

          def rb(x): return int(math.floor(x+0.5))
          def summary(cname,stage,buckets):
            good=[r for r in rows if r['case']==cname and r['stage']==stage and 'max_c' in r]
            vals=[r['max_c'] for r in good]
            votes={}
            for v in vals: votes[str(rb(v))]=votes.get(str(rb(v)),0)+1
            diag={}
            for b in buckets:
              d=[abs(v-b) for v in vals]
              diag[str(b)]={'votes':sum(rb(v)==b for v in vals),'mean_abs_distance_c':statistics.mean(d) if d else None,'within_0_75c':sum(x<=.75 for x in d),'within_1_25c':sum(x<=1.25 for x in d)}
            return {'n':len(vals),'mean':statistics.mean(vals) if vals else None,'median':statistics.median(vals) if vals else None,'votes':votes,'bucket':diag}

          result={'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),'resolver_proxy':'LIMC','rows':rows,'cases':{}}
          for cname,c in CASES.items():
            buckets=sorted({a[1] for a in c['actions']})
            pre=summary(cname,'pre_12z',buckets); post=summary(cname,'post_18z',buckets)
            changes={}
            for b in buckets:
              a=pre['bucket'][str(b)]; z=post['bucket'][str(b)]
              changes[str(b)]={'vote_delta':z['votes']-a['votes'],'mean_abs_distance_delta_c':None if a['mean_abs_distance_c'] is None or z['mean_abs_distance_c'] is None else z['mean_abs_distance_c']-a['mean_abs_distance_c'],'within_0_75c_delta':z['within_0_75c']-a['within_0_75c'],'within_1_25c_delta':z['within_1_25c']-a['within_1_25c']}
            result['cases'][cname]={**c,'pre':pre,'post':post,'changes':changes}

          (OUT/'milan-multimodel-fast.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          L=['# Bounded Milan multi-model probe','',f'Generated: **{result["generated_at"]}**','','All values are archived deterministic daily maxima at LIMC. Nearest-degree votes and distance are diagnostics, not calibrated settlement probabilities.','']
          for cname,c in result['cases'].items():
            L += [f'## {cname} — target {c["target_date"]}','','Wallet: '+', '.join(f'**{a[0]} {a[1]}°C** @ {a[2]:.4f}' for a in c['actions']),'', '| Stage | Model | Run | Max | Nearest |','|---|---|---|---:|---:|']
            for stage in ['pre_12z','post_18z']:
              for r in [x for x in rows if x['case']==cname and x['stage']==stage]:
                if 'max_c' in r: L.append(f'| {stage} | {r["provider_model"]} | {r["run"]} | {r["max_c"]:.2f}°C | {rb(r["max_c"])}°C |')
                else: L.append(f'| {stage} | {r["provider_model"]} | {r["run"]} | ERROR | — |')
            L += ['',f'12Z mean/median: **{c["pre"]["mean"]:.2f}/{c["pre"]["median"]:.2f}°C**' if c['pre']['mean'] is not None else '12Z: no successful models',f'18Z mean/median: **{c["post"]["mean"]:.2f}/{c["post"]["median"]:.2f}°C**' if c['post']['mean'] is not None else '18Z: no successful models',f'12Z votes: `{json.dumps(c["pre"]["votes"],sort_keys=True)}`',f'18Z votes: `{json.dumps(c["post"]["votes"],sort_keys=True)}`','','### Wallet-bucket movement','','| Bucket | Vote Δ | Mean distance Δ | ≤0.75°C Δ | ≤1.25°C Δ |','|---:|---:|---:|---:|---:|']
            for b,ch in c['changes'].items():
              d=ch['mean_abs_distance_delta_c']; ds='NA' if d is None else f'{d:+.3f}°C'
              L.append(f'| {b}°C | {ch["vote_delta"]:+d} | {ds} | {ch["within_0_75c_delta"]:+d} | {ch["within_1_25c_delta"]:+d} |')
            cand=[x for x in rows if x['case']==cname and x['stage']=='icon_eu_21z_candidate'][0]
            L += ['','ICON-EU 21Z candidate: '+(f'**{cand["max_c"]:.2f}°C** (nearest {rb(cand["max_c"])}°C).' if 'max_c' in cand else f'error `{cand.get("error")}`'),'']
          (OUT/'milan-multimodel-fast.md').write_text('\n'.join(L),encoding='utf-8')
          PY
      - name: Commit bounded probe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/milan-multimodel-fast.json research/data/milan-multimodel-fast.md
          git diff --cached --quiet && exit 0
          git commit -m "data: capture bounded Milan multi-model revisions"
          git pull --rebase origin main
          git push
