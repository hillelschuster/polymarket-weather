name: One-shot Milan local-model retry

on:
  push:
    paths:
      - '.github/workflows/milan-multimodel-retry-once.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retry only rate-limited runs
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, time, urllib.error, urllib.parse, urllib.request
          OUT=pathlib.Path('research/data'); OUT.mkdir(parents=True,exist_ok=True)
          END='https://single-runs-api.open-meteo.com/v1/forecast'
          tasks=[
            ('june25','DWD ICON-EU 12Z','dwd_icon_eu','2026-06-24T12:00','2026-06-25'),
            ('june25','DWD ICON-EU 18Z','dwd_icon_eu','2026-06-24T18:00','2026-06-25'),
            ('june25','DWD ICON-EU 21Z','dwd_icon_eu','2026-06-24T21:00','2026-06-25'),
            ('june25','ItaliaMeteo ICON-2I 12Z','italia_meteo_arpae_icon_2i','2026-06-24T12:00','2026-06-25'),
            ('june30','ARPEGE Europe 18Z','meteofrance_arpege_europe','2026-06-28T18:00','2026-06-30'),
          ]
          def one(item):
            case,label,model,run,target=item
            q=urllib.parse.urlencode({'latitude':45.61667,'longitude':8.73333,'hourly':'temperature_2m','models':model,'run':run,'forecast_days':4,'timezone':'Europe/Rome'})
            url=END+'?'+q
            last=None
            for attempt in range(3):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'polymarket-weather-research/1.0'})
                with urllib.request.urlopen(req,timeout=30) as r: p=json.loads(r.read())
                vals=[(t,v) for t,v in zip(p['hourly']['time'],p['hourly']['temperature_2m']) if t[:10]==target and v is not None]
                if not vals: raise RuntimeError('no target-date rows')
                t,v=max(vals,key=lambda x:x[1])
                return {'case':case,'label':label,'model':model,'run':run,'target_date':target,'max_c':float(v),'max_local_time':t,'target_hours':len(vals),'url':url}
              except urllib.error.HTTPError as e:
                body=e.read().decode('utf-8',errors='replace'); last=f'HTTP {e.code}: {body}'
                if e.code!=429: break
              except Exception as e: last=repr(e)
              time.sleep(2+attempt*2)
            return {'case':case,'label':label,'model':model,'run':run,'target_date':target,'error':last,'url':url}
          rows=[]
          for t in tasks:
            rows.append(one(t)); time.sleep(1)
          (OUT/'milan-multimodel-retry.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          L=['# Milan multi-model rate-limit retry','', '| Case | Run | Daily max | Target-day hours |','|---|---|---:|---:|']
          for r in rows:
            if 'max_c' in r: L.append(f'| {r["case"]} | {r["label"]} | {r["max_c"]:.2f}°C | {r["target_hours"]} |')
            else: L.append(f'| {r["case"]} | {r["label"]} | ERROR `{r["error"]}` | — |')
          L += ['', 'A run is usable for a civil-day maximum only if it covers the relevant daytime peak. `target_hours` is preserved specifically to detect partial-day short-cycle artifacts.', '']
          (OUT/'milan-multimodel-retry.md').write_text('\n'.join(L),encoding='utf-8')
          PY
      - name: Commit retry output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/milan-multimodel-retry.json research/data/milan-multimodel-retry.md
          git diff --cached --quiet && exit 0
          git commit -m "data: recover rate-limited Milan model runs"
          git pull --rebase origin main
          git push
